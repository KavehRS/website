layout: compress

<!DOCTYPE html>
{% assign page_lang = page.lang | default: 'en' %}
<html lang="{{ page_lang }}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" as="image" href="{{ '/assets/images/home/hero.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=portrait-circle">
  {% seo %}
  <link rel="describedby" href="{{ '/llms.txt' | absolute_url }}">
  <link rel="alternate" type="application/json" href="{{ '/webmcp-catalog.json' | absolute_url }}" title="WebMCP catalog">
  {% include structured-data-logbook.html %}
  {% include favicon.html %}
</head>
<body class="site-home">
  <a class="skip-link" href="#content">Skip to content</a>
  {% include site-header.html %}
  <main id="content">
    {% include home-page.html %}
  </main>
  {% include site-footer.html %}
  {% include analytics.html %}
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/webmcp.js' | relative_url }}" defer></script>
</body>
</html>
