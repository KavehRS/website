---
layout: default
---

{% assign dir = page.dir_attr | default: 'ltr' %}
{% assign about_parts = content | split: '<!--home-columns-->' %}

<div class="about-page" dir="{{ dir }}">
  <div class="about-hero">
    {% if page.profile and page.profile.image %}
      <img
        class="about-photo"
        src="{{ page.profile.image | relative_url }}"
        alt="{{ page.profile.image_alt | default: page.title | default: site.title | escape }}"
        loading="eager"
        decoding="async"
        width="176"
        height="176">
    {% endif %}

    <div class="about-intro">
      {{ about_parts[0] }}
    </div>
  </div>
  {% if about_parts.size > 1 %}
    {{ about_parts[1] }}
  {% endif %}
</div>
