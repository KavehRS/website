### Site settings

title: Kaveh RezaeiShiraz
tagline: "Software Engineer & Climber"
description: >-
  کاوه‌ رضایی‌شیراز — مهندس نرم‌افزار، MBA فناوری اطلاعات و سیستم‌های اطلاعاتی،
  علاقه‌مند به متن‌باز و کوهنوردی. یادداشت‌های فنی و گزارش صعود.
lang: fa-IR
locale: fa_IR

# Allow publishing dated logbook/blog entries ahead of the climb date
future: true

baseurl: ""
url: "https://www.kavehrs.com"
email: me@kavehrs.com

# Logo used by jekyll-seo-tag (Open Graph / JSON-LD)
logo: /assets/images/logos/1/kavehrs.jpg

author:
  name: Kaveh RezaeiShiraz
  twitter: kavehrs
  url: https://www.kavehrs.com/

# Social profiles for jekyll-seo-tag JSON-LD
social:
  name: Kaveh RezaeiShiraz
  links:
    - https://www.linkedin.com/in/kavehrs
    - https://github.com/kavehrs
    - https://twitter.com/kavehrs
    - https://www.facebook.com/imkavehrs
    - https://www.instagram.com/imkavehrs

# Twitter card settings for jekyll-seo-tag
twitter:
  username: kavehrs
  card: summary

# Social media usernames used in footer links
facebook: "imkavehrs"
instagram: "imkavehrs"
linkedin: "kavehrs"
github: "kavehrs"
#researchgate: "#"
#orcid: "0000-0001-9591-7724"

highlighter: rouge
markdown: kramdown

# Tracker (Google Analytics 4 measurement ID)
analytics: G-X4V1FLGZMH

#optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

collections:
  projects:
    output: false
    permalink: /projects/:path/
  blog:
    output: true
    permalink: /blog/:path/
  logbook:
    output: true
    permalink: /logbook/:path/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logos/1/kavehrs.jpg
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: blog
    values:
      layout: post
  - scope:
      path: ""
      type: logbook
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      sitemap: false
      noindex: true

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _drafts
  - .cursor

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-email-protect
  #- jekyll-target-blank
